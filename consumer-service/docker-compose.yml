services:
  redis:
    image: redis:7-alpine
    container_name: hiremind-redis
    ports:
      - "6379:6379"
    networks:
      - hiremind-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  consumer-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiremind-consumer-service
    volumes:
      - ./.env:/.env:ro
    env_file:
      - .env
    ports:
      - "50051:50051"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hiremind-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "50051" ]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  hiremind-network:
    driver: bridge
